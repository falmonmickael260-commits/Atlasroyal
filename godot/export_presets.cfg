[preset.0]
name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/*.json"
exclude_filter="preview*,*.mp4,*_test.gd,smoke.gd,pawns_gallery.gd,dice_gallery.gd,movement_demo.gd,web/*"
export_path="build/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name='theme-color' content='#091e25'><meta name='description' content='Fortune Empire : plateau 3D, huit pions et échanges entre joueurs sur une même table locale.'>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false
